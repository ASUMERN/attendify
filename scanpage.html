<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KYC Primary School Authentication</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9 url('assets/images/background.jpg') center/cover fixed no-repeat;
}

.card-auth{
    max-width:700px;
    margin:auto;
    margin-top:70px;
    border-radius:20px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);
    box-shadow:0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25);
    backdrop-filter:blur(14px) saturate(150%);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    overflow:hidden;
    z-index: 2;
}

.logo-box{
    width:140px;
    height:140px;
    border-radius:50%;
    border:4px solid #0d6efd;
    overflow:hidden;
    margin:auto;
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.auth-btn{
    height:170px;
    border-radius:18px;
    transition:.3s;
}

.auth-btn:hover{
    transform:scale(1.04);
}

.face-auth-btn{
    --bs-btn-color:#12b614;
    --bs-btn-border-color:#12b614;
    --bs-btn-hover-bg:#12b614;
    --bs-btn-hover-border-color:#12b614;
    --bs-btn-active-bg:#12b614;
    --bs-btn-active-border-color:#12b614;
}

.bi{
    font-size:60px;
}

#faceScannerPanel { max-width: 900px; margin: 2rem auto 4rem; }
#faceScannerVideo { width: 100%; height: 100%; object-fit: cover; }

</style>

</head>

<body>

    <div class="container">

        <div class="card card-auth">

            <div class="card-body p-5">

                <h2 class="text-center text-primary mb-4">
                 KYC Primary School
                </h2>

                <div class="logo-box mb-4">
                 <img src="assets/images/logo2.jpg" alt="School Logo">
                </div>

                <div class="row g-4">

                    <div class="col-md-6">

                        <button
                        class="btn btn-outline-primary w-100 auth-btn"
                        onclick="startFingerprint()">

                            <i class="bi bi-fingerprint"></i>

                            <h4 class="mt-3">Fingerprint</h4>

                        </button>

                    </div>

                    <div class="col-md-6">

                        <button
                        class="btn btn-outline-success w-100 auth-btn face-auth-btn"
                        onclick="startFace()">

                            <i class="bi bi-person-bounding-box"></i>

                            <h4 class="mt-3">Face Recognition</h4>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div id="faceScannerPanel" class="card card-auth d-none">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
                <div>
                    <h3 class="mb-1 text-success">Face Attendance Scanner</h3>
                    <p class="mb-0 text-muted">Choose the class, start the camera, then scan each student.</p>
                </div>
                <span id="scannerStatus" class="badge text-bg-secondary">Scanner idle</span>
            </div>

            <label for="classSession" class="form-label">Class being scanned</label>
            <select id="classSession" class="form-select mb-3" disabled>
                <option value="">Loading today's classes...</option>
            </select>

            <div class="ratio ratio-4x3 bg-dark rounded overflow-hidden">
                <video id="faceScannerVideo" autoplay muted playsinline></video>
            </div>
            <div class="d-flex gap-2 justify-content-center flex-wrap mt-3">
                <button type="button" class="btn btn-success" id="startScannerBtn"><i class="bi bi-camera-video me-1" style="font-size:1rem"></i>Start Camera</button>
                <button type="button" class="btn btn-outline-success" id="scanOnceBtn" disabled><i class="bi bi-search me-1" style="font-size:1rem"></i>Scan Face</button>
                <button type="button" class="btn btn-outline-secondary" id="stopScannerBtn" disabled><i class="bi bi-stop-circle me-1" style="font-size:1rem"></i>Stop</button>
            </div>

            <div class="text-center mt-4">
                <div id="scannerIcon" class="mb-2"><i class="bi bi-person-bounding-box text-success" style="font-size:3rem"></i></div>
                <div class="text-muted small">Recognition result</div>
                <div id="recognitionResult" class="fs-4 fw-bold">Waiting for scan</div>
                <div id="scannerMessage" class="small text-muted mt-2">Start the scanner, face the camera, then scan.</div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="scannerModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="scannerTitle"></h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                <div id="scannerContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    function startFingerprint() {
        window.location.href = 'fingerprint_scanner.php?autostart=1';
    }

    function startFace() {
        window.location.href = 'face_scanner.php?autostart=1';
    }
    </script>

    <script>
    window.APP_BASE_URL = window.location.pathname.replace(/\/[^/]*$/, '') || '';
    </script>
    <script src="assets/js/face_scanner.js"></script>

</body>
</html>
